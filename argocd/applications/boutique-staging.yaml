apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: boutique
  sources:
    - repoURL: https://github.com/jsboak/microservices-demo
      targetRevision: main
      path: helm-chart
      helm:
        releaseName: onlineboutique
        valueFiles:
          - $values/environments/staging/values.yaml
    - repoURL: https://github.com/jsboak/boutique-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
