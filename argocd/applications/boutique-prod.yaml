apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: boutique
  sources:
    - repoURL: https://github.com/jsboak/microservices-demo
      targetRevision: main
      path: helm-chart
      helm:
        releaseName: onlineboutique
        valueFiles:
          - $values/environments/prod/values.yaml
    - repoURL: https://github.com/jsboak/boutique-gitops
      targetRevision: main
      ref: values
  destination:
    name: gke-prod-us-central1
    namespace: boutique-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
        environment: prod
